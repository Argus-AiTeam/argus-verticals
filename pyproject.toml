[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-verticals"
version = "0.1.0"
description = "Community verticals (domain packs) for the Argus autonomous research and engineering runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Argus AI Team contributors" },
]
keywords = ["argus", "agent", "llm", "verticals", "domain-packs", "research", "engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
# Argus itself is installed from its repository, not from PyPI, and its version
# number does not move for the 2026-09-14 verticals split, so no requirement
# can express "an Argus at or after the split". Install Argus first (see the
# README); tests/test_contract_conformance.py probes the split and the
# 2026-09-14 argus_skill -> argus rename by capability.
dependencies = []

[project.optional-dependencies]
pcb = [
  "sexpdata>=1.0.2,<2",
]
# RF network analysis, separate from full-wave electromagnetic solvers.
rf = [
  "numpy>=1.26",
  "scikit-rf>=2.1,<3",
]
# Quantitative analysis and model tooling.
quant = [
  "numpy>=1.26",
  "pandas>=2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "mplfinance>=0.12.10b0",
  "lightgbm>=4",
  "torch>=2.2",
]
# The literary verticals' shared contracts (argus_verticals/literary/shared)
# validate with JSON Schema and read YAML source registries; the store's
# vertical.json manifests cite these exact strings in python_requirements.
literary = [
  "jsonschema>=4",
  "PyYAML>=6",
]
# Traditional/simplified Chinese folding for literary checks.
zh-fold = [
  "opencc>=1.1",
]
# Everything the test suite imports at module level. The heavy quant backends
# (lightgbm, torch, qlib, adata) are NOT here: the tests that need them skip
# when they are absent, so a contributor's machine and CI stay light.
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "PyYAML>=6",
  "jsonschema>=4",
  "numpy>=1.26",
  "pandas>=2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "mplfinance>=0.12.10b0",
  "scikit-rf>=2.1,<3",
  "sexpdata>=1.0.2,<2",
]

[project.urls]
Homepage = "https://github.com/Argus-AiTeam/argus-verticals"
Repository = "https://github.com/Argus-AiTeam/argus-verticals"
"Argus framework" = "https://github.com/lbx154/Argus"

# Argus reads this group at startup (argus.verticals._registry). Every
# vertical directory in argus_verticals/ must appear here exactly once; the
# conformance test (tests/test_contract_conformance.py) enforces that.
[project.entry-points."argus.verticals"]
ale_last_exam = "argus_verticals.ale_last_exam.stages"
analog_mixed_signal = "argus_verticals.analog_mixed_signal.stages"
chip_design = "argus_verticals.chip_design.stages"
classical_poetry = "argus_verticals.classical_poetry.stages"
digital_circuit = "argus_verticals.digital_circuit.stages"
digital_circuit_verification = "argus_verticals.digital_circuit.verification.stages"
fpga_design = "argus_verticals.fpga_design.stages"
digital_circuit_benchmark = "argus_verticals.digital_circuit.benchmark.stages"
fiction_writing = "argus_verticals.fiction_writing.stages"
kernelbench = "argus_verticals.kernelbench.stages"
literary_editor = "argus_verticals.literary_editor.stages"
materials = "argus_verticals.materials.stages"
medical = "argus_verticals.medical.stages"
modern_poetry = "argus_verticals.modern_poetry.stages"
nanochat = "argus_verticals.nanochat.stages"
nanogpt_speedrun = "argus_verticals.nanogpt_speedrun.stages"
physics = "argus_verticals.physics.stages"
pcb_design = "argus_verticals.pcb_design.stages"
prose = "argus_verticals.prose.stages"
quant = "argus_verticals.quant.stages"
rf_design = "argus_verticals.rf_design.stages"
speedrun = "argus_verticals.speedrun.stages"

[tool.hatch.build.targets.wheel]
packages = ["argus_verticals"]
# Skill markdown, JSON schemas, YAML registries, and reference corpora inside
# the package are runtime data and ship with the wheel.

[tool.hatch.build.targets.sdist]
include = [
  "argus_verticals/**",
  "tests/**",
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "build",
  "dist",
  ".venv",
]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = [
  "E501",
  "E402",
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argus_verticals"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
