name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hardware routing plus the concrete Manager-target fix found by the analog trial.
  ARGUS_REF: daa71b3ef4c51147497312145c4da52473bf36c9

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install executable hardware reference tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog yosys nextpnr-ice40 fpga-icestorm ngspice
      - name: Install the pinned official KiCad 9 package
        run: |
          curl --fail --location --retry 3 --output /tmp/kicad.deb https://ppa.launchpadcontent.net/kicad/kicad-9.0-releases/ubuntu/pool/main/k/kicad_9.0.9~ubuntu24.04.1_amd64.deb
          echo "b7e6d33867631dc44385067b703b4c39eadede2037a260790b19495fe17e43f0  /tmp/kicad.deb" | sha256sum --check
          sudo apt-get install -y --no-install-recommends /tmp/kicad.deb
          test "$(kicad-cli version)" = "9.0.9"
      - name: Install Argus (framework) and this package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argus @ git+https://github.com/lbx154/Argus.git@${ARGUS_REF}"
          python -m pip install -e ".[dev,zh-fold]"
      - name: Lint
        run: python -m ruff check argus_verticals tests scripts
      - name: Store catalog is current (catalog.json matches every vertical.json and stages.py)
        run: python scripts/build_catalog.py --check
      - name: Test
        run: python -m pytest -q
