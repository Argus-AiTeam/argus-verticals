name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Argus (framework) and this package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argus-skill @ git+https://github.com/lbx154/Argus.git@main"
          python -m pip install -e ".[dev,zh-fold]"
      - name: Lint
        run: python -m ruff check argus_verticals tests
      - name: Test
        run: python -m pytest -q
