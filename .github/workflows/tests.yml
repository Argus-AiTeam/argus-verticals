name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Paired framework support: lbx154/Argus#169. Hardware 1.x requires named
  # workflow profiles; pin the reviewed implementation, not a moving branch.
  ARGUS_REF: a0902ffbe459babf7fcaca99bc276a1b78c01ede

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator for executable RTL knowledge examples
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Install Argus (framework) and this package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argus @ git+https://github.com/lbx154/Argus.git@${ARGUS_REF}"
          python -m pip install -e ".[dev,zh-fold]"
      - name: Lint
        run: python -m ruff check argus_verticals tests scripts
      - name: Store catalog is current (catalog.json matches every vertical.json and stages.py)
        run: python scripts/build_catalog.py --check
      - name: Test
        run: python -m pytest -q
