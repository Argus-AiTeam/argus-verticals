name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Argus ref to test against. Pin it to a commit SHA at or after the
  # 2026-09-14 verticals split when a reproducible baseline is needed.
  # It must point at a commit that includes the argus_skill -> argus package
  # rename (2026-09-14) or later: this package imports `argus` and registers
  # the `argus.verticals` entry-point group, which an older Argus does not read.
  ARGUS_REF: 863e76426337e214d29d334ce8c273ac056db3f5  # Argus commit with the argus_skill -> argus rename (2026-09-14); must be this or later

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Argus (framework) and this package with its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argus @ git+https://github.com/lbx154/Argus.git@${ARGUS_REF}"
          python -m pip install -e ".[dev,zh-fold]"
      - name: Lint
        run: python -m ruff check argus_verticals tests scripts
      - name: Store catalog is current (catalog.json matches every vertical.json and stages.py)
        run: python scripts/build_catalog.py --check
      - name: Test
        run: python -m pytest -q
